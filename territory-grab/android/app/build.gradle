plugins {
    id 'com.android.application'
}

android {
    namespace "com.ollie.territory"
    compileSdk 34

    defaultConfig {
        applicationId "com.ollie.territory"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
